name: Helm Chart

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/ow-course-designer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      - run: helm lint "$CHART" -f "$CHART/ci/test-values.yaml"
      - run: helm template ow-course-designer "$CHART" -f "$CHART/ci/test-values.yaml" > /dev/null
      # CD publishes a chart only when its version is new, so a chart change
      # without a version bump would never reach the cluster.
      - name: Chart version bumped when the chart changes
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if ! git cat-file -e "$base:$CHART/Chart.yaml" 2>/dev/null; then
            echo "New chart"
            exit 0
          fi
          if git diff --quiet "$base"...HEAD -- "$CHART" ":(exclude)$CHART/ci"; then
            echo "Chart unchanged"
            exit 0
          fi
          old=$(git show "$base:$CHART/Chart.yaml" | awk '/^version:/ {print $2}')
          new=$(awk '/^version:/ {print $2}' "$CHART/Chart.yaml")
          if [ "$old" = "$new" ]; then
            echo "::error file=$CHART/Chart.yaml::The chart changed but its version is still $new. Bump it so CD publishes the change."
            exit 1
          fi
          echo "Chart version $old -> $new"
