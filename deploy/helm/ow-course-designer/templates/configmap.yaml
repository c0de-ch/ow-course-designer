apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "owcd.fullname" . }}
  labels:
    {{- include "owcd.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  # Next.js binds to $HOSTNAME, which Kubernetes sets to the pod name; listen on
  # all interfaces so Puppeteer can reach the app on localhost.
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
  HOME: /tmp
  DATABASE_PROVIDER: sqlite
  DATABASE_URL: file:/app/data/prod.db
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
  AUTH_TRUST_HOST: "true"
  {{- with .Values.appUrl }}
  APP_URL: {{ . | quote }}
  AUTH_URL: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
