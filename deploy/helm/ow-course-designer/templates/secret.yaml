{{- if not .Values.secrets.existingSecret }}
{{- if not (index .Values.secrets.create "AUTH_SECRET") }}
{{- fail "Set secrets.existingSecret, or at least secrets.create.AUTH_SECRET" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "owcd.secretName" . }}
  labels:
    {{- include "owcd.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.create }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
